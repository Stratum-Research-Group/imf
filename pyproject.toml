[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imf"
version = "0.8.0"
description = "Interaction Model Foundations (IMF): Symmetric-Antisymmetric Virtual Grid Polytope Memory, Continuous Lie SSMs, and Polytope Mixture-of-Experts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Stratum Research Group", email = "research@stratum.group" },
]
keywords = [
    "deep-learning",
    "mechanistic-interpretability",
    "attention-mechanisms",
    "polytopes",
    "triton",
    "formal-verification",
    "lean4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "torch>=2.0.0",
    "triton>=2.1.0",
    "numpy>=1.24.0",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]
branding = [
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[tool.setuptools]
packages = ["imf"]
py-modules = [
    "benchmark_mqar",
    "benchmark_polytopes",
    "benchmark_polytope_ablation",
    "benchmark_dimension_scaling",
    "benchmark_spo_multihop",
    "benchmark_long_context_mqar",
    "benchmark_needle_in_haystack",
    "benchmark_niah_matrix",
    "benchmark_reversal_curse",
    "chat_imf",
    "demo_char_lm",
    "higher_arity_simplex",
    "multihead_savg",
    "polytope_connector",
    "pretrain_imf_lm",
    "quickstart_example",
    "stress_spo_multihop",
    "test_reversal_benchmark",
    "test_savg_directionality",
    "test_savg_harness",
    "train_imf_corpus",
    "train_scaled_imf",
    "triton_savg_kernel",
    "visualize_polytope_sparsity",
    "web_demo",
]

[project.scripts]
chat-imf = "chat_imf:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
