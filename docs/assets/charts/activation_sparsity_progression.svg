<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace;">
    <text x="50" y="35" fill="#f8fafc" font-size="18" font-weight="bold">IMF Activation Sparsity & Compute Efficiency Scaling</text>
