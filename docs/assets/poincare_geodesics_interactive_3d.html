<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IMF Poincaré Ball Hyperbolic Geodesic Raytracer (3D)</title>
    <style>
        body { margin: 0; background: #020306; color: #eee; font-family: sans-serif; overflow: hidden; }
        #canvas { width: 100vw; height: 100vh; display: block; }
        #overlay { position: absolute; top: 16px; left: 16px; background: rgba(6,10,18,0.85); padding: 16px; border-radius: 8px; border: 1px solid #1a283e; }
        h1 { margin: 0 0 8px 0; font-size: 18px; color: #00e676; }
        p { margin: 4px 0; font-size: 13px; color: #90a4ae; }
    </style>
</head>
<body>
    <div id="overlay">
        <h1>Poincaré Hyperbolic Ball (ℍ³) Raytracer</h1>
        <p>Riemannian Metric: ds² = 4 dx² / (1 - ‖x‖²)²</p>
        <p>Curvature κ = -1.0 | Geodesic Circular Arcs to Ideal Boundary</p>
        <p>Conformal Invariance: Isom(ℍ³) ≅ SO⁺(3, 1) ≅ PSL(2, ℂ)</p>
    </div>
    <canvas id="canvas"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Unit sphere representing ideal boundary of Poincare ball
        const boundaryGeo = new THREE.SphereGeometry(4.0, 32, 32);
        const boundaryMat = new THREE.MeshBasicMaterial({ color: 0x00e676, wireframe: true, transparent: true, opacity: 0.15 });
        const boundary = new THREE.Mesh(boundaryGeo, boundaryMat);
        scene.add(boundary);

        // Generate circular geodesic arcs orthogonal to boundary
        const geodesicsGroup = new THREE.Group();
        const numArcs = 48;
        for (let i = 0; i < numArcs; i++) {
            const curve = new THREE.EllipseCurve(
                0, 0,
                2.5, 2.5,
                0, Math.PI,
                false,
                0
            );
            const points = curve.getPoints(50);
            const arcGeo = new THREE.BufferGeometry().setFromPoints(points);
            const arcMat = new THREE.LineBasicMaterial({
                color: new THREE.Color().setHSL((i / numArcs), 0.8, 0.5),
                transparent: true,
                opacity: 0.7
            });
            const arc = new THREE.Line(arcGeo, arcMat);
            arc.rotation.x = Math.random() * Math.PI * 2;
            arc.rotation.y = Math.random() * Math.PI * 2;
            arc.rotation.z = Math.random() * Math.PI * 2;
            geodesicsGroup.add(arc);
        }
        scene.add(geodesicsGroup);

        camera.position.z = 9;

        function animate() {
            requestAnimationFrame(animate);
            boundary.rotation.y += 0.001;
            geodesicsGroup.rotation.y += 0.002;
            geodesicsGroup.rotation.x += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
