<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto">
  <defs>
    <linearGradient id="leechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <filter id="leechGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="460" fill="url(#leechBg)" rx="8" stroke="#1f2937" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-family="'Liberation Sans', sans-serif" font-size="15" font-weight="bold">Wolfram 24D Leech Lattice Λ₂₄ Kissing Vector Census &amp; Conway Orbit Foliation</text>
  <text x="40" y="58" fill="#9ca3af" font-family="'Liberation Sans', sans-serif" font-size="11">Decomposition of the 196,560 minimal kissing vectors (||u||² = 4 in ℝ²⁴) into three canonical Conway orbits</text>

  <!-- Central Foliation Hierarchy Graph -->
  <!-- Top Root Node: Lambda_24 -->
  <rect x="360" y="85" width="180" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" filter="url(#leechGlow)"/>
  <text x="450" y="110" fill="#f8fafc" font-family="'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Leech Lattice Λ₂₄ (τ₂₄ = 196,560)</text>

  <!-- Connective Hierarchy Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.65">
    <path d="M 410 125 L 180 185" />
    <path d="M 450 125 L 450 185" />
    <path d="M 490 125 L 720 185" />
  </g>

  <!-- Orbit 1: Cross Vectors -->
  <rect x="70" y="185" width="220" height="95" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="180" y="210" fill="#38bdf8" font-family="'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Orbit 1: Cross Vectors</text>
  <text x="180" y="232" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Shape: (±4², 0²²)</text>
  <text x="180" y="252" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">binom(24, 2) × 2² = 276 × 4</text>
  <text x="180" y="272" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N₁ = 1,104 Vectors</text>

  <!-- Orbit 2: Golay Octad Vectors -->
  <rect x="340" y="185" width="220" height="95" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="450" y="210" fill="#a78bfa" font-family="'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Orbit 2: Golay Octads</text>
  <text x="450" y="232" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Shape: (±2⁸, 0¹⁶)</text>
  <text x="450" y="252" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">759 octads × 2⁷ even signs</text>
  <text x="450" y="272" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N₂ = 97,152 Vectors</text>

  <!-- Orbit 3: Odd Vectors -->
  <rect x="610" y="185" width="220" height="95" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
  <text x="720" y="210" fill="#f472b6" font-family="'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Orbit 3: Odd Vectors</text>
  <text x="720" y="232" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">Shape: (∓3¹, ±1²³)</text>
  <text x="720" y="252" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">24 choices × 2¹² Golay signs</text>
  <text x="720" y="272" fill="#f472b6" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">N₃ = 98,304 Vectors</text>

  <!-- Combinatorial Re-convergence Bracket -->
  <g stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6">
    <path d="M 180 280 L 180 320 L 450 320" />
    <path d="M 450 280 L 450 320" />
    <path d="M 720 280 L 720 320 L 450 320" />
    <line x1="450" y1="320" x2="450" y2="345" stroke="#10b981" stroke-width="2" stroke-dasharray="none"/>
  </g>

  <!-- Sum Node -->
  <rect x="290" y="345" width="320" height="42" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" filter="url(#leechGlow)"/>
  <text x="450" y="371" fill="#ecfdf5" font-family="'Liberation Sans', sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">N_total = 1,104 + 97,152 + 98,304 = 196,560</text>

  <!-- Bottom Badges -->
  <rect x="40" y="405" width="400" height="38" rx="4" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="428" fill="#cbd5e1" font-family="sans-serif" font-size="11">Conway Automorphism: |Co₀| = 2²²·3⁹·5⁴·7²·11·13·23 ≈ 8.315×10¹⁸</text>

  <rect x="460" y="405" width="400" height="38" rx="4" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="1"/>
  <text x="470" y="428" fill="#cbd5e1" font-family="sans-serif" font-size="11">Euler-Lucas Cannonball Identity: 1² + 2² + ... + 24² = 70² = 4,900</text>
</svg>
