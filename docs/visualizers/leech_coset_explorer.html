<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The 24D Leech Lattice Lambda_24 Interactive Coset Explorer</title>
  <style>
    body { margin: 0; background-color: #030712; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    #overlay {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(10px);
      border: 1px solid #1f2937; border-radius: 12px; padding: 20px 24px;
      max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { font-size: 1.25rem; margin: 0 0 6px 0; color: #38bdf8; }
    p { font-size: 0.85rem; color: #9ca3af; line-height: 1.4; margin: 0 0 14px 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-right: 6px; }
    .badge-tau { background: #064e3b; color: #34d399; }
    .badge-co { background: #312e81; color: #a5b4fc; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.82rem; }
    .stat-val { font-family: monospace; color: #fbbf24; }
    .controls { margin-top: 15px; border-top: 1px solid #374151; padding-top: 12px; }
    label { font-size: 0.8rem; color: #d1d5db; display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type=range] { width: 100%; margin-bottom: 10px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Leech Lattice &Lambda;<sub>24</sub> Coset Explorer</h1>
    <p>Interactive 24D &rarr; 3D affine projection of the 196,560 minimal kissing vectors.</p>
    <div style="margin-bottom: 12px;">
      <span class="badge badge-tau">&tau;<sub>24</sub> = 196,560</span>
      <span class="badge badge-co">Aut = Co<sub>0</sub></span>
    </div>
    <div class="stat-row"><span>Type 1 (Octads &plusmn;2<sup>8</sup> 0<sup>16</sup>):</span><span class="stat-val">97,152</span></div>
    <div class="stat-row"><span>Type 2 (Odd (&plusmn;3)<sup>1</sup> (&plusmn;1)<sup>23</sup>):</span><span class="stat-val">98,304</span></div>
    <div class="stat-row"><span>Type 3 (Coordinate (&plusmn;4)<sup>2</sup> 0<sup>22</sup>):</span><span class="stat-val">1,104</span></div>
    <div class="stat-row"><span>Minimal Squared Norm:</span><span class="stat-val">||v||<sup>2</sup> = 32</span></div>

    <div class="controls">
      <label><span>Subspace Slice Dim (u, v):</span><span id="slice-val">Axes 0, 1, 2</span></label>
      <input type="range" id="dim-slice" min="0" max="21" value="0" step="1">
      <label><span>Rotation Phase:</span><span id="rot-val">0.00 rad</span></label>
      <input type="range" id="phase-slice" min="0" max="6.28" value="0" step="0.05">
    </div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030712, 0.02);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Generate sampled representative vectors across the 3 Leech types
    const pointsGeom = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];

    const N_POINTS = 5000;
    for (let k = 0; k < N_POINTS; k++) {
      let vec = new Float32Array(24);
      let col = new THREE.Color();

      const randType = Math.random();
      if (randType < 0.49) {
        // Type 1: Octad vector
        col.setHex(0x38bdf8); // Cyan
        for (let i = 0; i < 8; i++) vec[i] = (Math.random() > 0.5 ? 2 : -2);
      } else if (randType < 0.98) {
        // Type 2: 3^1 1^23
        col.setHex(0xfbbf24); // Amber
        vec[0] = (Math.random() > 0.5 ? 3 : -3);
        for (let i = 1; i < 24; i++) vec[i] = (Math.random() > 0.5 ? 1 : -1);
      } else {
        // Type 3: 4^2 0^22
        col.setHex(0xf43f5e); // Rose
        vec[0] = (Math.random() > 0.5 ? 4 : -4);
        vec[1] = (Math.random() > 0.5 ? 4 : -4);
      }

      // Random permutation across 24 coords
      for (let i = 23; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = vec[i]; vec[i] = vec[j]; vec[j] = temp;
      }

      // Project 24D -> 3D
      let x = vec[0] * 2.5 + vec[3] + vec[6];
      let y = vec[1] * 2.5 + vec[4] + vec[7];
      let z = vec[2] * 2.5 + vec[5] + vec[8];

      positions.push(x, y, z);
      colors.push(col.r, col.g, col.b);
    }

    pointsGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    pointsGeom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const pMaterial = new THREE.PointsMaterial({
      size: 0.6,
      vertexColors: true,
      transparent: true,
      opacity: 0.85
    });

    const pointCloud = new THREE.Points(pointsGeom, pMaterial);
    scene.add(pointCloud);

    // Axes helper & bounding shell
    const shellGeom = new THREE.SphereGeometry(18, 32, 32);
    const shellMat = new THREE.MeshBasicMaterial({ color: 0x1f2937, wireframe: true, transparent: true, opacity: 0.15 });
    const shellMesh = new THREE.Mesh(shellGeom, shellMat);
    scene.add(shellMesh);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      pointCloud.rotation.y += 0.002;
      pointCloud.rotation.x += 0.001;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
