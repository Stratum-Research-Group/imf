<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IMF 24D Leech Lattice Golay Code Projector</title>
  <style>
    body { margin: 0; background: #030712; color: #f8fafc; font-family: monospace; overflow: hidden; }
    #header { position: absolute; top: 16px; left: 24px; z-index: 10; pointer-events: none; }
    h1 { margin: 0; font-size: 1.15rem; color: #38bdf8; }
    p { margin: 4px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="header">
    <h1>IMF 24D LEECH LATTICE GOLAY CODE PROJECTOR</h1>
    <p>Extended Binary Golay Code $G_{24}$ Octad Frames &bull; 196,560 Minimal Vectors &bull; Drag to Rotate</p>
  </div>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(6, 6, 6);
    scene.add(pointLight);

    // 24D Golay Octad Projection frame: 24 orthogonal axes projected to 3D via Coxeter projection
    const axesCount = 24;
    const frameGroup = new THREE.Group();

    for (let i = 0; i < axesCount; i++) {
      const theta = (i / axesCount) * Math.PI * 2;
      const phi = ((i % 8) / 8) * Math.PI - Math.PI / 2;
      const x = Math.cos(theta) * Math.cos(phi) * 3.5;
      const y = Math.sin(theta) * Math.cos(phi) * 3.5;
      const z = Math.sin(phi) * 3.5;

      const geom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(x, y, z)
      ]);
      const mat = new THREE.LineBasicMaterial({
        color: i % 2 === 0 ? 0x38bdf8 : 0xa855f7,
        transparent: true,
        opacity: 0.6
      });
      frameGroup.add(new THREE.Line(geom, mat));
    }
    scene.add(frameGroup);

    // Golay Codeword Octads (weight-8 vectors)
    const octadCount = 759; // Number of octads in G24
    const octadGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(octadCount * 3);

    for (let i = 0; i < octadCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 2.8 + (Math.sin(i * 0.1) * 0.2);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }

    octadGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const octadMat = new THREE.PointsMaterial({ color: 0x34d399, size: 0.06 });
    const octadPoints = new THREE.Points(octadGeom, octadMat);
    scene.add(octadPoints);

    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouse.x;
      const deltaY = e.clientY - prevMouse.y;
      frameGroup.rotation.y += deltaX * 0.005;
      frameGroup.rotation.x += deltaY * 0.005;
      octadPoints.rotation.y += deltaX * 0.005;
      octadPoints.rotation.x += deltaY * 0.005;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      frameGroup.rotation.y += 0.0015;
      octadPoints.rotation.y += 0.0015;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
