<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IMF 8D/24D Voronoi Polytope Decomposer</title>
  <style>
    body { margin: 0; background: #030712; color: #f8fafc; font-family: monospace; overflow: hidden; }
    #header { position: absolute; top: 16px; left: 24px; z-index: 10; pointer-events: none; }
    h1 { margin: 0; font-size: 1.15rem; color: #38bdf8; }
    p { margin: 4px 0 0 0; font-size: 0.8rem; color: #94a3b8; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="header">
    <h1>IMF 8D/24D VORONOI POLYTOPE DECOMPOSER</h1>
    <p>Projective Voronoi Cells in $E_8$ and Leech Lattices &bull; Drag to rotate</p>
  </div>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Add ambient and point light
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // Create 24-cell / Voronoi polytope wireframe
    const geometry = new THREE.IcosahedronGeometry(2.5, 1);
    const wireframe = new THREE.WireframeGeometry(geometry);
    const line = new THREE.LineSegments(wireframe);
    line.material.color.setHex(0x38bdf8);
    line.material.transparent = true;
    line.material.opacity = 0.7;
    scene.add(line);

    // Inner dual cell
    const innerGeom = new THREE.OctahedronGeometry(1.4, 0);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0xa855f7,
      wireframe: true,
      roughness: 0.2
    });
    const innerMesh = new THREE.Mesh(innerGeom, innerMat);
    scene.add(innerMesh);

    // Add orbital particles representing Gosset root codepoints
    const particleCount = 240;
    const particleGeom = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 3.2 + (Math.random() - 0.5) * 0.4;
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }

    particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x34d399, size: 0.05 });
    const particles = new THREE.Points(particleGeom, particleMat);
    scene.add(particles);

    let isDragging = false;
    let prevMouse = { x: 0, y: 0 };

    window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const deltaX = e.clientX - prevMouse.x;
      const deltaY = e.clientY - prevMouse.y;
      line.rotation.y += deltaX * 0.005;
      line.rotation.x += deltaY * 0.005;
      innerMesh.rotation.y -= deltaX * 0.005;
      innerMesh.rotation.x -= deltaY * 0.005;
      particles.rotation.y += deltaX * 0.002;
      prevMouse = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      line.rotation.y += 0.002;
      line.rotation.x += 0.001;
      innerMesh.rotation.y -= 0.003;
      particles.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
