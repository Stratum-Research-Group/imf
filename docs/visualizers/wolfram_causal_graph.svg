<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="450" fill="url(#bgGrad)" rx="8" stroke="#1f2937" stroke-width="1.5"/>
  <text x="35" y="38" fill="#f3f4f6" font-family="'Liberation Sans', sans-serif" font-size="15" font-weight="bold">Wolfram Multiway Causal State-Graph &amp; Discrete Homotopy Folia</text>
  <text x="35" y="58" fill="#9ca3af" font-family="'Liberation Sans', sans-serif" font-size="11">Causal invariance branchings under rewriting rules $\sigma_{i} 	o \sigma_{i+1}$ yielding conformal geodesics across step depths</text>

  <!-- Edges -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.75" marker-end="url(#arrow)">
    <!-- Depth 0 to 1 -->
    <path d="M 100 225 L 230 155" />
    <path d="M 100 225 L 230 295" />

    <!-- Depth 1 to 2 -->
    <path d="M 250 150 L 380 95" />
    <path d="M 250 150 L 380 220" />
    <path d="M 250 300 L 380 230" />
    <path d="M 250 300 L 380 355" />

    <!-- Depth 2 to 3 -->
    <path d="M 400 90 L 530 55" />
    <path d="M 400 90 L 530 145" />
    <path d="M 400 225 L 530 155" />
    <path d="M 400 225 L 530 295" />
    <path d="M 400 360 L 530 305" />
    <path d="M 400 360 L 530 395" />

    <!-- Depth 3 to 4 -->
    <path d="M 550 50 L 680 35" />
    <path d="M 550 50 L 680 105" />
    <path d="M 550 150 L 680 115" />
    <path d="M 550 150 L 680 205" />
    <path d="M 550 300 L 680 245" />
    <path d="M 550 300 L 680 335" />
    <path d="M 550 400 L 680 345" />
    <path d="M 550 400 L 680 415" />

    <!-- Re-converging branchial edges (Causal Invariance) -->
    <path d="M 700 110 L 820 215" stroke="#a855f7" stroke-dasharray="4,3" stroke-width="1.8"/>
    <path d="M 700 210 L 820 225" stroke="#a855f7" stroke-dasharray="4,3" stroke-width="1.8"/>
    <path d="M 700 240 L 820 235" stroke="#a855f7" stroke-dasharray="4,3" stroke-width="1.8"/>
  </g>

  <!-- Nodes -->
  <!-- D0 -->
  <circle cx="100" cy="225" r="9" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" filter="url(#glow)"/>
  <text x="100" y="205" fill="#e0f2fe" font-family="monospace" font-size="10" text-anchor="middle">S(0,0)</text>

  <!-- D1 -->
  <circle cx="250" cy="150" r="8" fill="#0369a1" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="250" y="133" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">S(1,0)</text>
  <circle cx="250" cy="300" r="8" fill="#0369a1" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="250" y="322" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">S(0,1)</text>

  <!-- D2 -->
  <circle cx="400" cy="90" r="8" fill="#075985" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="73" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">S(2,0)</text>
  <circle cx="400" cy="225" r="8" fill="#075985" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="210" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">S(1,1)</text>
  <circle cx="400" cy="360" r="8" fill="#075985" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="400" y="382" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">S(0,2)</text>

  <!-- D3 -->
  <circle cx="550" cy="50" r="7" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="550" cy="150" r="7" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="550" cy="300" r="7" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="550" cy="400" r="7" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- D4 -->
  <circle cx="700" cy="35" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="700" cy="110" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="700" cy="210" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="700" cy="240" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="700" cy="340" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="700" cy="415" r="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>

  <!-- Final Confluent State (Causal Invariance) -->
  <circle cx="830" cy="225" r="11" fill="#9333ea" stroke="#f3e8ff" stroke-width="2.5" filter="url(#glow)"/>
  <text x="830" y="203" fill="#f3e8ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Confluent S*</text>

  <!-- Legend -->
  <rect x="45" y="375" width="280" height="55" fill="rgba(15,23,42,0.85)" rx="5" stroke="#334155" stroke-width="1"/>
  <line x1="55" y1="392" x2="85" y2="392" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="95" y="396" fill="#cbd5e1" font-size="10" font-family="sans-serif">Multiway Rule Application</text>
  <line x1="55" y1="415" x2="85" y2="415" stroke="#a855f7" stroke-dasharray="4,3" stroke-width="2"/>
  <text x="95" y="419" fill="#cbd5e1" font-size="10" font-family="sans-serif">Branchial Confluence (Causal Invariance)</text>
</svg>