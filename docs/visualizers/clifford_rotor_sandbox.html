<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clifford Bivector &amp; Rotor Sandbox</title>
  <style>
    body { margin: 0; background-color: #030712; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; }
    #overlay {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px);
      border: 1px solid #1f2937; border-radius: 8px; padding: 18px 22px; max-width: 420px;
    }
    h1 { font-size: 1.2rem; color: #38bdf8; margin: 0 0 6px 0; }
    p { font-size: 0.82rem; color: #9ca3af; line-height: 1.4; margin: 0 0 10px 0; }
    .eq { font-family: monospace; background: #030712; padding: 6px 10px; border-radius: 4px; border: 1px solid #374151; color: #fbbf24; font-size: 0.9rem; margin-bottom: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="overlay">
    <h1>Clifford Rotor Sandbox: Cl(3,0) &rarr; Spin(3)</h1>
    <p>Visualizing spatial vector rotation via the universal spinor sandwich operator with zero metric drift.</p>
    <div class="eq">u' = R u R~</div>
    <div class="eq">R = cos(&theta;/2) - B sin(&theta;/2)</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Coordinate Axes
    const axes = new THREE.AxesHelper(6);
    scene.add(axes);

    // Bivector plane disc (e1 ^ e2 plane)
    const planeGeom = new THREE.CircleGeometry(5, 32);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    const planeMesh = new THREE.Mesh(planeGeom, planeMat);
    planeMesh.rotation.x = Math.PI / 2;
    scene.add(planeMesh);

    // Rotating vector u
    const dir = new THREE.Vector3(1, 0, 0);
    const origin = new THREE.Vector3(0, 0, 0);
    const length = 4.5;
    const hex = 0xfbbf24;
    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex, 0.6, 0.3);
    scene.add(arrowHelper);

    // Vector trajectory trail
    const trailGeom = new THREE.BufferGeometry();
    const trailPoints = [];
    for (let a = 0; a <= Math.PI * 2; a += 0.05) {
      trailPoints.push(new THREE.Vector3(Math.cos(a) * length, 0, Math.sin(a) * length));
    }
    trailGeom.setFromPoints(trailPoints);
    const trailMat = new THREE.LineBasicMaterial({ color: 0x34d399 });
    const trailLine = new THREE.Line(trailGeom, trailMat);
    scene.add(trailLine);

    let theta = 0;
    function animate() {
      requestAnimationFrame(animate);
      theta += 0.02;
      // Sandwich product R u R~ rotates in plane
      arrowHelper.setDirection(new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta)));
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
