<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="auto">
  <defs>
    <linearGradient id="simplexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <filter id="simGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="460" fill="url(#simplexBg)" rx="8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" fill="#f8fafc" font-family="'Liberation Sans', sans-serif" font-size="15" font-weight="bold">Barycentric Simplex Gating &amp; 98.4375% Micro-Expert Polytope Projection</text>
  <text x="40" y="58" fill="#94a3b8" font-family="'Liberation Sans', sans-serif" font-size="11">Top-2 active dispatch over E = 128 micro-experts: S = 1 - 2/128 = 63/64 = 98.4375% inactive sparsity</text>

  <!-- Triangular 2-Simplex Projection in 8D Subspace -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <polygon points="450,110 270,360 630,360" fill="rgba(56,189,248,0.06)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Median Altitudes & Barycentric Contours -->
    <line x1="450" y1="110" x2="450" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="270" y1="360" x2="540" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="630" y1="360" x2="360" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Micro-Expert Centroid Vertices (c1, c2, c3) -->
  <circle cx="450" cy="110" r="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" filter="url(#simGlow)"/>
  <text x="450" y="90" fill="#e0f2fe" font-family="'Liberation Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Centroid c₁ (Expert e₁)</text>

  <circle cx="270" cy="360" r="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" filter="url(#simGlow)"/>
  <text x="250" y="385" fill="#e0f2fe" font-family="'Liberation Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Centroid c₂ (Expert e₂)</text>

  <circle cx="630" cy="360" r="8" fill="#0284c7" stroke="#e0f2fe" stroke-width="2" filter="url(#simGlow)"/>
  <text x="650" y="385" fill="#e0f2fe" font-family="'Liberation Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Centroid c₃ (Expert e₃)</text>

  <!-- Projected Token Embedding State x_t -->
  <g stroke="#a855f7" stroke-width="1.8">
    <line x1="420" y1="260" x2="450" y2="110" stroke="#38bdf8" stroke-dasharray="3,3"/>
    <line x1="420" y1="260" x2="270" y2="360" stroke="#34d399" stroke-width="2"/>
    <line x1="420" y1="260" x2="630" y2="360" stroke="#38bdf8" stroke-dasharray="3,3"/>
  </g>

  <circle cx="420" cy="260" r="7" fill="#9333ea" stroke="#f3e8ff" stroke-width="2" filter="url(#simGlow)"/>
  <text x="410" y="245" fill="#f3e8ff" font-family="monospace" font-size="11" font-weight="bold">Token State x_t</text>

  <!-- Convex Gating Weights Callout -->
  <rect x="520" y="210" width="160" height="60" rx="4" fill="rgba(15,23,42,0.9)" stroke="#64748b" stroke-width="1"/>
  <text x="530" y="230" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">w₂ = 0.4506 (Top-1)</text>
  <text x="530" y="248" fill="#38bdf8" font-family="monospace" font-size="11">w₃ = 0.3021 (Top-2)</text>
  <text x="530" y="263" fill="#64748b" font-family="monospace" font-size="10">w₁ = 0.2473 (Pruned)</text>

  <!-- Left Side Telemetry Box -->
  <rect x="35" y="110" width="180" height="120" fill="rgba(15,23,42,0.85)" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="45" y="132" fill="#f8fafc" font-weight="bold" font-family="sans-serif" font-size="11">Polytope Sparsity Law:</text>
  <text x="45" y="154" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Total Micro-Experts: E=128</text>
  <text x="45" y="172" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Active Dispatch: k=2</text>
  <text x="45" y="193" fill="#34d399" font-weight="bold" font-family="sans-serif" font-size="11">Inactive: 126/128</text>
  <text x="45" y="212" fill="#38bdf8" font-weight="bold" font-family="sans-serif" font-size="11">Sparsity: 98.4375%</text>

  <!-- Right Side Telemetry Box -->
  <rect x="685" y="110" width="180" height="120" fill="rgba(15,23,42,0.85)" rx="6" stroke="#334155" stroke-width="1"/>
  <text x="695" y="132" fill="#f8fafc" font-weight="bold" font-family="sans-serif" font-size="11">Silicon Benchmarks:</text>
  <text x="695" y="154" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Dense FFN: 4.82 ms</text>
  <text x="695" y="172" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Coarse 8-MoE: 2.14 ms</text>
  <text x="695" y="193" fill="#34d399" font-weight="bold" font-family="sans-serif" font-size="11">128-MoPE: 1.41 ms</text>
  <text x="695" y="212" fill="#38bdf8" font-weight="bold" font-family="sans-serif" font-size="11">Speedup: 3.41x vs Dense</text>

  <!-- Footer Banner -->
  <rect x="35" y="405" width="830" height="38" rx="4" fill="rgba(15,23,42,0.8)" stroke="#334155" stroke-width="1"/>
  <text x="450" y="428" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Theorem 6.1: Convex Gating Normalization w₁ + w₂ = 1.0 with Strict Gradient Preservation Across Dual Streams</text>
</svg>
