name: IMF Quality & Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Recompile Native Shared Objects on Runner
        run: |
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_gather_scatter.cpp -luring -o csrc/fused_iouring_gather_scatter.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_checkpoint_rollback.cpp -luring -o csrc/fused_iouring_checkpoint_rollback.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_sqpoll_engine.cpp -luring -o csrc/fused_iouring_sqpoll_engine.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_splice_pipe.cpp -luring -o csrc/fused_iouring_splice_pipe.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_multishot_poll.cpp -luring -o csrc/fused_iouring_multishot_poll.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_reg_engine.cpp -luring -o csrc/fused_iouring_direct_reg_engine.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_socket_sendmsg.cpp -luring -o csrc/fused_iouring_socket_sendmsg.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_eventfd_signaling.cpp -luring -o csrc/fused_iouring_eventfd_signaling.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_ringbuf_interop.cpp -luring -o csrc/fused_iouring_ringbuf_interop.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_splice_socket.cpp -luring -o csrc/fused_iouring_splice_socket.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_socket_recvmsg.cpp -luring -o csrc/fused_iouring_socket_recvmsg.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_multishot_accept.cpp -luring -o csrc/fused_iouring_multishot_accept.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_fixed_file_table.cpp -luring -o csrc/fused_iouring_fixed_file_table.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_cooperative_task_work.cpp -luring -o csrc/fused_iouring_cooperative_task_work.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_splice_pipe_to_socket.cpp -luring -o csrc/fused_iouring_direct_splice_pipe_to_socket.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_splice_socket_to_pipe.cpp -luring -o csrc/fused_iouring_direct_splice_socket_to_pipe.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_multishot_read_ringbuf.cpp -luring -o csrc/fused_iouring_multishot_read_ringbuf.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_fixed_dma_buf_nvme_passthru.cpp -luring -o csrc/fused_iouring_fixed_dma_buf_nvme_passthru.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_sqpoll_passthru_cmd.cpp -luring -o csrc/fused_iouring_sqpoll_passthru_cmd.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_registered_pipesplice.cpp -luring -o csrc/fused_iouring_registered_pipesplice.so
          cp csrc/fused_iouring_registered_pipesplice.so csrc/libfused_iouring_registered_pipesplice.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_epoll_eventfd_ring.cpp -luring -o csrc/fused_iouring_epoll_eventfd_ring.so
          cp csrc/fused_iouring_epoll_eventfd_ring.so csrc/libfused_iouring_epoll_eventfd_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_bpf_memtrace_ring.cpp -o csrc/fused_iouring_bpf_memtrace_ring.so
          cp csrc/fused_iouring_bpf_memtrace_ring.so csrc/libfused_iouring_bpf_memtrace_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_dmabuf_ring.cpp -o csrc/fused_iouring_dmabuf_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_futex_waitv_ring.cpp -o csrc/fused_iouring_futex_waitv_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_send_zc_notify_ring.cpp -o csrc/fused_iouring_send_zc_notify_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_workstealing_multiring.cpp -o csrc/fused_iouring_workstealing_multiring.so
          cp csrc/fused_iouring_workstealing_multiring.so csrc/libfused_iouring_workstealing_multiring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_nvme_streaming.cpp -o csrc/fused_iouring_direct_nvme_streaming.so
          cp csrc/fused_iouring_direct_nvme_streaming.so csrc/libfused_iouring_direct_nvme_streaming.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_vectored_socket_splice_fifo.cpp -o csrc/fused_iouring_vectored_socket_splice_fifo.so
          cp csrc/fused_iouring_vectored_socket_splice_fifo.so csrc/libfused_iouring_vectored_socket_splice_fifo.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_page_pool_allocator.cpp -o csrc/libfused_iouring_page_pool_allocator.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_socket_multiplexer.cpp -o csrc/libfused_iouring_socket_multiplexer.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_socket_buf_recycler.cpp -o csrc/libfused_iouring_socket_buf_recycler.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_numa_page_distributor.cpp -o csrc/libfused_iouring_numa_page_distributor.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_zc_rx_ring.cpp -o csrc/libfused_iouring_zc_rx_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_zc_tx_burst.cpp -o csrc/libfused_iouring_zc_tx_burst.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_kernel_page_migrator.cpp -o csrc/libfused_iouring_kernel_page_migrator.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_hugepage_compactor.cpp -o csrc/libfused_iouring_hugepage_compactor.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_dmabuf_zc_stream.cpp -o csrc/libfused_iouring_dmabuf_zc_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_memfd_secret_stream.cpp -o csrc/libfused_iouring_memfd_secret_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_mseal_protected_stream.cpp -o csrc/libfused_iouring_mseal_protected_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_futex2_wake_stream.cpp -o csrc/libfused_iouring_futex2_wake_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_splice_pipe_tee_stream.cpp -o csrc/libfused_iouring_splice_pipe_tee_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_sq_thread_cpu_pinning_stream.cpp -o csrc/libfused_iouring_sq_thread_cpu_pinning_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_fixed_dma_buf_direct_nvme.cpp -o csrc/libfused_iouring_fixed_dma_buf_direct_nvme.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_ring_buffer_zero_alloc.cpp -o csrc/libfused_iouring_direct_ring_buffer_zero_alloc.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_direct_splice_tee_zerocopy.cpp -o csrc/libfused_iouring_direct_splice_tee_zerocopy.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_registered_ringbuf_eventfd_splice.cpp -o csrc/libfused_iouring_registered_ringbuf_eventfd_splice.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_etale_shm_ring_stream.cpp -o csrc/libfused_iouring_etale_shm_ring_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_kunneth_shm_mmap_splice.cpp -o csrc/libfused_iouring_kunneth_shm_mmap_splice.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_perverse_sheaf_ring_splice.cpp -o csrc/libfused_iouring_perverse_sheaf_ring_splice.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_slice_shm_mmap.cpp -o csrc/libfused_iouring_motivic_slice_shm_mmap.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_galois_symbol_splice_stream.cpp -o csrc/libfused_iouring_galois_symbol_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_truncation_splice_ring.cpp -o csrc/libfused_iouring_motivic_truncation_splice_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_bott_periodicity_shm_ring.cpp -o csrc/libfused_iouring_bott_periodicity_shm_ring.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_quillen_patching_dma_stream.cpp -o csrc/libfused_iouring_quillen_patching_dma_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_higher_chow_splice_stream.cpp -o csrc/libfused_iouring_higher_chow_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_singular_cycle_splice_stream.cpp -o csrc/libfused_iouring_singular_cycle_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_exceptional_galois_splice_stream.cpp -o csrc/libfused_iouring_exceptional_galois_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_cobordism_splice_stream.cpp -o csrc/libfused_iouring_motivic_cobordism_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_milnor_witt_splice_stream.cpp -o csrc/libfused_iouring_milnor_witt_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_adams_novikov_splice_stream.cpp -o csrc/libfused_iouring_adams_novikov_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_tmf_splice_stream.cpp -o csrc/libfused_iouring_motivic_tmf_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_bp_splice_stream.cpp -o csrc/libfused_iouring_motivic_bp_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_lubin_tate_splice_stream.cpp -o csrc/libfused_iouring_motivic_lubin_tate_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_nilpotence_splice_stream.cpp -o csrc/libfused_iouring_motivic_nilpotence_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_smash_product_splice_stream.cpp -o csrc/libfused_iouring_motivic_smash_product_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_gross_hopkins_splice_stream.cpp -o csrc/libfused_iouring_motivic_gross_hopkins_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_motivic_goerss_hopkins_splice_stream.cpp -o csrc/libfused_iouring_motivic_goerss_hopkins_splice_stream.so
          g++ -O3 -shared -fPIC -std=c++17 csrc/fused_iouring_weight_streamer.cpp -o bin/libfused_iouring_weight_streamer.so
          cp bin/libfused_iouring_weight_streamer.so csrc/libfused_iouring_weight_streamer.so


      - name: Install uv and Python
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv sync --extra dev || true
          uv pip install pytest numpy || true

      - name: Install Lean 4 via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check Lean Pilot Files (Zero Sorry, Zero Axiom)
        run: |
          cd lean_pilot
          lake exe cache get
          lake build
          ! grep -rn "^[[:space:]]*sorry\b" Pilot/

      - name: Run Pytest Test Suites
        run: |
          uv run pytest tests/test_iouring_engines.py -v

      - name: Run io_uring Benchmark & Assert Regression Bounds
        run: |
          uv run python scripts/benchmark_iouring_hardware.py
          uv run python -c "
          import json
          with open('docs/benchmarks/reproducible_iouring_hardware_benchmark.json') as f:
              data = json.load(f)
          lat = data['gather_scatter_engine']['16_vecs_4KB']['latency_us']
          assert lat < 500.0, f'Regression: gather/scatter latency exceeded threshold: {lat} us'
          print(f'io_uring performance verified: {lat} us (threshold < 500.0 us)')
          "

      - name: Verify Paper Header Uniformity
        run: |
          uv run python -c "
          import glob, re
          papers = glob.glob('papers/phase_*/paper_*.md')
          assert len(papers) >= 600, f'Expected at least 600 papers, got {len(papers)}'
          for p in papers:
              text = open(p).read()
              assert text.startswith('# Paper '), f'Invalid title in {p}'
              assert '**Hardware Target:**' in text, f'Missing hardware target in {p}'
              assert '**Series:**' in text, f'Missing series in {p}'
              assert '**Paper Type:**' in text, f'Missing paper type in {p}'
              assert '**Status:**' in text, f'Missing status in {p}'
          print(f'Successfully verified {len(papers)} papers!')
          "
