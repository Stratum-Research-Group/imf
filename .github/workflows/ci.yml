name: IMF Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PyTest & Lean 4 Core Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.6.5/install.sh | sh

      - name: Install Lean 4 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Verify Lean 4 Lake Build
        run: |
          elan --version
          lake build

      - name: Run PyTest Test Suite
        run: CUDA_VISIBLE_DEVICES="" uv run pytest tests/ -m "not cuda and not gpu" --ignore=tests/test_iouring_engines.py

      - name: Verify MCTS Prover
        run: uv run python imf/mcts_lean_prover.py

      - name: Verify Autonomous RSI Daemon
        run: uv run python imf/imf_daemon.py --iterations 2 --sleep 0.1
