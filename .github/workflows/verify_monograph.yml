name: Verify Monograph Proofs and Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lean4-proof-check:
    name: Lean 4 Kernel Axiom and Proof Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Elan & Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.16.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Lean 4 Kernel Axioms (0 sorryAx)
        run: |
          python3 scripts/verify_lean4_axioms.py

      - name: Check Module 83 Axioms via #print axioms
        run: |
          cd lean_pilot
          lake exe cache get || true
          lake clean Pilot.LieRollingCacheStability || true
          lake build Pilot.LieRollingCacheStability 2>&1 | tee module83_build.log
          grep -E "Built Pilot.LieRollingCacheStability|Replayed Pilot.LieRollingCacheStability" module83_build.log
          ! grep -i "sorryAx" module83_build.log
          echo "Pilot.LieRollingCacheStability verified: strictly 0 sorryAx" 


  benchmark-and-suite:
    name: Numerical Benchmarks & Algorithms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install numpy scipy torch

      - name: Run Synthetic Blackwell & Lattice Benchmarks
        run: |
          python3 scripts/benchmark_blackwell_suite.py
          test -f benchmark_results/blackwell_sm120_telemetry_complete.json

      - name: Verify Volume 1 Worked Examples (All 18 Concrete Numerical Proofs)
        run: |
          python3 scripts/verify_vol1_worked_examples.py

      - name: Verify Volume 2 Worked Examples (All 16 Concrete Numerical Proofs)
        run: |
          python3 scripts/verify_vol2_worked_examples.py

  wolfram-syntax-audit:
    name: Wolfram Language (.wls) Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Wolfram Scripts Integrity
        run: |
          for f in scripts/wolfram/*.wls; do
            echo "Auditing $f..."
            test -s "$f" || exit 1
          done
